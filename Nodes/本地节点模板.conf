# 仅作格式参考。不要将填入真实参数后的副本提交 GitHub。
[Proxy]
# SS2022-ShadowTLS = ss, <域名>, <端口>, encrypt-method=2022-blake3-aes-256-gcm, password=<SS2022密码>, shadow-tls-password=<ShadowTLS密码>, shadow-tls-version=3, udp-relay=false
# AnyTLS = anytls, <域名>, <端口>, password=<AnyTLS密码>, sni=<域名>, skip-cert-verify=false
# Hysteria2 = hysteria2, <域名>, <端口>, password=<Hysteria2密码>, sni=<域名>, skip-cert-verify=false
# Snell = snell, <域名>, <端口>, psk=<SnellPSK>, version=5

[Proxy Group]
