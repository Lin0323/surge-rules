# 将本文件 [Rule] 区块替换到 Surge 配置中。
# 前提：你的 [Proxy Group] 中存在“节点选择”。

[Rule]
# 广告：先使用维护活跃的上游基础规则，再加载本仓库的保守补充。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/广告补充.list,REJECT

# 海外主流服务：可将“节点选择”改为独立媒体策略组。
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/YouTube.list,节点选择
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/TikTok.list,节点选择
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/Netflix.list,节点选择
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/DisneyPlus.list,节点选择
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/AppleTV.list,节点选择
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/海外媒体.list,节点选择

# 国内服务：ChinaMax 为完整国内规则；补充列表优先保留常用中国服务。
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Surge/规则/国内直连补充.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax_All.list,DIRECT
GEOIP,CN,DIRECT

# 局域网和最终策略。
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
FINAL,节点选择
