#!MANAGED-CONFIG https://raw.githubusercontent.com/Lin0323/surge-rules/main/Config/Main.conf interval=86400 strict=false
# Surge iOS 主入口配置。此文件不含任何服务器地址、密码、UUID 或密钥。
# 使用前：把自己的节点仅添加到本机的 Surge [Proxy] 区，并按 README 将节点名加入“Proxy / Backup”策略组。

[General]
loglevel = notify
dns-server = system, 223.5.5.5, 119.29.29.29
test-timeout = 15
show-error-page-for-reject = false

[Proxy]
# 请仅在本机配置中添加节点；不要把真实节点、UUID、密码、WireGuard 私钥或 Reality 密钥提交到 GitHub。
# 示例（删除开头的 # 并替换尖括号内容）：
# 我的节点 = trojan, <服务器>, <端口>, password=<密码>, sni=<域名>, skip-cert-verify=false

[Proxy Group]
# Auto 是自动测速入口。首次导入时仅含 DIRECT 以保证可用；添加节点后请删除 DIRECT 并将实际节点名称加入 Auto。
Auto = url-test, DIRECT, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=8, evaluate-before-use=true
Proxy = select, Auto, DIRECT
AI = select, Proxy, DIRECT
Media = select, Proxy, DIRECT
Developer = select, Proxy, DIRECT
Apple = select, Proxy, DIRECT
Spotify = select, Proxy, DIRECT
Backup = fallback, Auto, DIRECT, url=http://www.gstatic.com/generate_204, interval=600, timeout=8

[Rule]
# 规则按从上到下首次命中执行；本仓库保持规则集轻量并按用途拆分。
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Advertising.list,REJECT
# 海外服务由分类规则集选择对应策略；保持当前普通 DNS 解析方式，避免额外解析配置造成兼容问题。
# 国内常用服务优先直连；其余国内域名仍由 GEOIP,CN 规则处理。
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-KEYWORD,baidu,DIRECT
DOMAIN-KEYWORD,taobao,DIRECT
DOMAIN-KEYWORD,jd,DIRECT
DOMAIN-KEYWORD,wechat,DIRECT
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/AI.list,AI
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Developer.list,Developer
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Streaming.list,Media
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Spotify.list,Spotify
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Social.list,Proxy
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Apple.list,Apple
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/Lin0323/surge-rules/main/Rules/Domestic.list,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy

[Panel]
# Surge iOS 4.9.3+：轻触卡片的刷新按钮执行完整检测；自动刷新仅在进入策略选择页时触发。
网络诊断 = title="网络诊断",content="轻触刷新以检查出口、节点、DNS 与常用服务",style=info,icon=stethoscope,icon-color=#007AFF,script-name=NetworkDiagnosticsPanel,update-interval=600

[Script]
# Panel 为唯一的日常入口。旧的单项脚本保留在仓库中，供排障或二次开发参考，不再显示为手动任务。
NetworkDiagnosticsPanel = type=generic,script-path=https://raw.githubusercontent.com/Lin0323/surge-rules/main/Scripts/Panel.js,script-update-interval=86400,timeout=20,argument=proxy-group=Proxy

[MITM]
enable = false
hostname = %APPEND% -*.apple.com, -*.icloud.com, -*.mzstatic.com
